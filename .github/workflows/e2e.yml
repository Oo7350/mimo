name: e2e

# 端到端回归：15 套套件 + 3 个探针，入口就是 e2e/run-all.mjs（本地同一条命令）。
#
# 实跑记录（v2.22.3 起，真实 GitHub runner）：
# - run #8（手动 dispatch，5747663）8m36s 全绿；run #9（push，e9a1219）8m57s 全绿；
#   run #10（push，07780f5）8m31s 全绿。KNOWN-024「CI 从没在真实 runner 上跑过」已关闭。
# - 归档：v2.22.0 的 run #4 是红的——「启动后端」180 秒等不到登录（BUG-123/125 的症状），
#   之后 4 个 step 全 skipped。当时文档写成"未验证"，其实是"验证失败没人读结果"。
#
# 这轮演练照出三个真问题（都已修，见 bug-log BUG-123）：
#   1. 基础建表脚本 init.sql **从来没被执行过**——空库上一张表都建不出来；
#   2. 顺序没定：空库上第一个启动期 Runner 抢在建表前面查表，直接崩；
#   3. 空库没有任何账号，而 CI 第一步就要 admin/123456 登录。
# 所以下面的步骤顺序是"踩过坑之后"的顺序，别随意调换。
#
# v2.22.4 加了两个 job：
# - 主 job 末尾跑一次量级压测 + 性能探针（只出数字，不设门槛，跑完清库）；
# - `two-instance`：两个后端共用一个 Redis，验证跨实例在线/广播（此前只在开发机上跑过）。
#
# 这三次推送（#12/#13/#14）把"新写的闸门自己有没有毛病"验了一遍：
#   #12 主 job 绿，two-instance 红在顺序（先灌种子再起后端 → 空库没表，BUG-130）；
#   #13 重排后主 job 红在「只建出 25 张表」（就绪判定太早，BUG-131）；
#   #14 两个 job 同时绿：e2e 8 分 45 秒、two-instance 2 分 1 秒（commit 76b2a11）。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  # 同一分支连续推送时取消旧的那次，省 runner 也省得两份数据库互相干扰
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mimo
          MYSQL_USER: mimo
          MYSQL_PASSWORD: mimo123
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # 与本地 dev-env.ps1 一一对应。注意 MIMO_DB_URL 到 v2.22.2 才真正被 application.yml 读取，
      # 在此之前这行是句废话（硬编码 localhost:3306/mimo）。
      JWT_SECRET: mimo-ci-secret-key-please-change-in-prod-0123456789abcdef
      JWT_EXPIRATION: "86400000"
      MIMO_DB_URL: jdbc:mysql://127.0.0.1:3306/mimo?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      MIMO_DB_USERNAME: mimo
      MIMO_DB_PASSWORD: mimo123
      # CI 没有 Redis：显式写 memory，别指望 auto 探测给出可复现的结果
      MIMO_REALTIME_STORE: memory
      # 空库引导：迁移只建表不建账号，CI 第一步就要登录，所以这里显式开一个管理员
      MIMO_BOOTSTRAP_ADMIN_USERNAME: admin
      MIMO_BOOTSTRAP_ADMIN_PASSWORD: "123456"
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
      NO_PROXY: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 后端单元测试
        run: mvn -B -f backend/pom.xml test

      - name: 打包后端
        run: mvn -B -f backend/pom.xml -DskipTests package

      # 双实例 job 复用同一个 jar：省掉一次 Maven 打包（约 2 分钟）
      - name: 上传后端 jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/mimo-app/target/mimo-app-1.0.0-SNAPSHOT.jar
          retention-days: 1

      # 空库首次启动 = 建表（db/migration/V0__init.sql 起）+ 引导管理员。
      #
      # 就绪判定的信号必须**在迁移跑完之后**才出现。这里用：
      #   ① 日志里出现 "[MigrationRunner] 全部迁移完成"——这是 MigrationRunner 循环之后
      #      打的最后一行，它是"库建完了"的**唯一**直接证据；
      #   ② 登录接口能过。
      # 两个曾经的错答案，别再改回去（BUG-131 → BUG-134）：
      #   - 只看登录：Spring Boot 的 HTTP 端口比 Runner 先开，迁移跑到一半 users 表已存在、
      #     登录能过，整个库却只有 25 张表；
      #   - 改看 "Started MimoApplication"：那句是 Spring 刷完上下文的日志，出现在
      #     ApplicationRunner **之前**——本地实测比迁移跑完早 7.6~8.6 秒，等于把一个假信号换成了
      #     另一个假信号（当时没红，全靠下一步自检有 60 秒轮询兜着）。
      - name: 启动后端
        run: |
          nohup java -jar backend/mimo-app/target/mimo-app-1.0.0-SNAPSHOT.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "\[MigrationRunner\] 全部迁移完成" backend.log \
               && curl -sf -X POST http://localhost:8080/api/auth/login \
                    -H 'Content-Type: application/json' \
                    -d '{"username":"admin","password":"123456"}' > /dev/null; then
              echo "后端就绪（迁移已完成）"; exit 0
            fi
            sleep 3
          done
          echo "::error::后端 180 秒内未就绪"
          echo "--- 迁移完成日志出现次数：$(grep -c '\[MigrationRunner\] 全部迁移完成' backend.log || true)"
          echo "--- 最后 10 条迁移日志 ---"
          grep '\[MigrationRunner\]' backend.log | tail -10 || true
          tail -80 backend.log; exit 1

      - name: 建表结果自检
        run: |
          # 只留数字：docker exec 偶尔会带一行 warning，`[ "" -lt 30 ]` 会报
          # "integer expression expected"，那种错误信息完全看不出真实原因
          tables=0
          for i in $(seq 1 30); do
            tables=$(docker exec -i ${{ job.services.mysql.id }} \
              mysql -umimo -pmimo123 -N -B mimo \
              -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='mimo'" \
              | tr -dc '0-9')
            tables=${tables:-0}
            if [ "$tables" -ge 30 ]; then break; fi
            echo "第 ${i} 次：已建表 ${tables} 张，等 2 秒再看"
            sleep 2
          done
          echo "已建表 ${tables} 张"
          # 38 是 v2.22.2 的实测值；少一半说明迁移链断在中间，早点红比跑完 15 套才发现好
          if [ "$tables" -lt 30 ]; then
            echo "::error::只建出 ${tables} 张表，迁移链可能没跑完整"
            # MigrationRunner 不往库里写"迁移记录表"，只打日志，所以翻日志才是真相
            echo "--- backend.log 里的迁移记录（最后 20 行）---"
            grep "MigrationRunner" backend.log | tail -20 || true
            echo "--- 现有表 ---"
            docker exec -i ${{ job.services.mysql.id }} \
              mysql -umimo -pmimo123 -N -B mimo -e "SHOW TABLES" || true
            exit 1
          fi

      # 演示账号（admin / zhangsan / lisi + 团队 1）。种子放在单独文件里而不是建表脚本里，
      # 就是为了不让"默认口令"跟着 DDL 自动进生产库。
      - name: 灌演示账号
        run: |
          docker exec -i ${{ job.services.mysql.id }} \
            mysql -umimo -pmimo123 --default-character-set=utf8mb4 mimo \
            < backend/mimo-app/src/main/resources/db/seed-demo.sql

      # e2e 全家假定「团队 1 + 项目 1 + 三列看板」，这里用真实接口把它们建出来（幂等）
      - name: 预热项目
        run: node e2e/seed-fresh-db.mjs

      - name: 前端依赖、类型检查与构建
        run: |
          cd frontend
          npm ci
          npm run build

      # 用 dev server 而不是 vite preview：e2e 里的页面请求走 vite 的 /api 代理，
      # preview 不配 proxy 会全部 404。本地验证的也是 dev。
      - name: 启动前端
        run: |
          cd frontend
          nohup npx vite --port 5173 --strictPort > ../frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/ > /dev/null; then
              echo "前端就绪"; exit 0
            fi
            sleep 2
          done
          echo "前端 120 秒内未就绪"; tail -40 ../frontend.log; exit 1

      # 预热一次入口模块：Vite 首次编译要比后续请求慢，别把冷启动算到第一个用例的 20 秒超时里
      - name: 预热前端编译
        run: |
          curl -sf http://localhost:5173/src/main.ts > /dev/null && echo "入口模块已编译"

      - name: 安装 Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm i playwright@1.65.1
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/pw/node_modules/playwright" >> "$GITHUB_ENV"

      - name: 跑全部 e2e（失败即红）
        run: node e2e/run-all.mjs --probes --base http://localhost:5173 --api http://localhost:8080/api

      # ---------------------------------------------------------------- 量级验证
      # 开发库常年是 3 个人 20 个工作项，"性能"这件事一直是推理没数字。这里在 CI 上造一次
      # 100 用户 / 500 工作项 / 5000 活动日志，量一遍核心接口的 p50/p95 并写进日志，
      # **不设门槛**（机器规格会变，拿它当红线只会变成随机红）。跑完立刻清库，不影响后续。
      - name: 造量级测试数据
        run: |
          docker exec -i ${{ job.services.mysql.id }} \
            mysql -umimo -pmimo123 --default-character-set=utf8mb4 mimo \
            < tools/seed-load.sql

      - name: 性能探针（只出数字，不作为门槛）
        run: node e2e/perf-probe.mjs --iters 5

      - name: 清理量级测试数据
        if: always()
        run: |
          docker exec -i ${{ job.services.mysql.id }} \
            mysql -umimo -pmimo123 --default-character-set=utf8mb4 mimo \
            < tools/cleanup-load.sql

      - name: 失败时留存日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            backend.log
            frontend.log
            e2e/xss-report.md
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 双实例：两个后端进程共用一个 Redis / 一个 MySQL。
  # 验证"连在 B 上的人，A 的在线列表里也有"以及"从 A 发的消息，B 上的客户端能收到"。
  #
  # 为什么单独一个 job 而不是塞进主 job：主 job 的前端 e2e 跑的是 store=memory
  # （可复现、不依赖 Redis），两套语义混在一个进程里会互相干扰。这里换一个干净的库和 Redis。
  # v2.22.4 之前，这个用例只在开发机上跑过——"我这能跑"不算证据。
  # ---------------------------------------------------------------------------
  two-instance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: e2e

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mimo
          MYSQL_USER: mimo
          MYSQL_PASSWORD: mimo123
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      JWT_SECRET: mimo-ci-secret-key-please-change-in-prod-0123456789abcdef
      JWT_EXPIRATION: "86400000"
      MIMO_DB_URL: jdbc:mysql://127.0.0.1:3306/mimo?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      MIMO_DB_USERNAME: mimo
      MIMO_DB_PASSWORD: mimo123
      # 这个 job 的全部意义就在这行：强制 Redis，两个实例才共享在线状态与广播
      MIMO_REALTIME_STORE: redis
      MIMO_REDIS_HOST: 127.0.0.1
      MIMO_REDIS_PORT: "6379"
      MIMO_BOOTSTRAP_ADMIN_USERNAME: admin
      MIMO_BOOTSTRAP_ADMIN_PASSWORD: "123456"
      NO_PROXY: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 取回后端 jar
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/mimo-app/target

      - name: 前端依赖（只要 STOMP 客户端）
        run: |
          cd frontend
          npm ci

      # 顺序很重要：**先起后端，再灌种子**。空库里还没有表，
      # 先灌 seed-demo.sql 会 `Table 'mimo.users' doesn't exist` 直接红
      # （v2.22.4 第一版就是这么写错的，见 bug-log BUG-130）。
      # 管理员由 MIMO_BOOTSTRAP_ADMIN_* 自动建出来，所以下面的探活不用等种子。
      - name: 启动两个实例（8080 / 8081）
        run: |
          JAR=backend/mimo-app/target/mimo-app-1.0.0-SNAPSHOT.jar
          # 就绪 = 日志里出现 "[MigrationRunner] 全部迁移完成" 且能登录。
          # 别用 "Started MimoApplication"：那句在 ApplicationRunner **之前**就打出来了
          # （本地实测比迁移跑完早 7.6~8.6 秒），拿它判等于没判（BUG-134）。
          wait_ready() {
            port=$1; log=$2
            for i in $(seq 1 60); do
              if grep -q "\[MigrationRunner\] 全部迁移完成" "$log" \
                 && curl -sf -X POST "http://localhost:${port}/api/auth/login" \
                      -H 'Content-Type: application/json' \
                      -d '{"username":"admin","password":"123456"}' > /dev/null; then
                echo "实例 ${port} 就绪（迁移已完成）"; return 0
              fi
              sleep 3
            done
            echo "::error::实例 ${port} 180 秒内未就绪"
            echo "--- 迁移完成日志出现次数：$(grep -c '\[MigrationRunner\] 全部迁移完成' "$log" || true)"
            echo "--- 最后 10 条迁移日志（${log}）---"
            grep '\[MigrationRunner\]' "$log" | tail -10 || true
            tail -60 backend-a.log backend-b.log
            return 1
          }
          # **串行启动**（BUG-135）：空库上两个进程同时跑迁移链是没有保障的——两边都在
          # CREATE TABLE / CREATE INDEX，撞上就按"已存在"跳过，谁也不能保证自己那份是完整的。
          # 实测红过一次「实例 8081 180 秒内未就绪」。第一个把库建完，第二个再起。
          nohup java -jar "$JAR" > backend-a.log 2>&1 &
          wait_ready 8080 backend-a.log || exit 1
          nohup java -jar "$JAR" --server.port=8081 > backend-b.log 2>&1 &
          wait_ready 8081 backend-b.log || exit 1

      - name: 灌演示账号（lisi 与团队 1，双实例用例要它们）
        run: |
          docker exec -i ${{ job.services.mysql.id }} \
            mysql -umimo -pmimo123 --default-character-set=utf8mb4 mimo \
            < backend/mimo-app/src/main/resources/db/seed-demo.sql

      - name: 双实例验证（跨实例在线 + 跨实例广播）
        run: node e2e/two-instance-presence.mjs

      - name: 失败时留存日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: two-instance-logs
          path: |
            backend-a.log
            backend-b.log
          if-no-files-found: ignore
