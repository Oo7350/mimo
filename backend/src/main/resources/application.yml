server:
  port: 8080

spring:
  application:
    name: mimo-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mimo?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: mimo
    password: mimo123

  redis:
    host: localhost
    port: 6379
    password:

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # 一次性迁移: 本地开发/首次部署时执行 V9__issue_gantt.sql
  # 生产环境会通过 flyway/sql init 自动跑，本配置 continue-on-error 确保不影响
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:db/migration/V9__issue_gantt.sql
      platform: mysql

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.mimo.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:MimoJwtSecretKey2024MustBeAtLeast256BitsLongForHS256Algorithm!!}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 hours in ms

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/chat/completions}

mimo:
  upload:
    dir: ${MIMO_UPLOAD_DIR:./uploads}

ai:
  provider: ${AI_PROVIDER:deepseek}
  model: ${AI_MODEL:deepseek-chat}
  temperature: ${AI_TEMPERATURE:0.7}
  max-tokens: ${AI_MAX_TOKENS:4096}
  daily-limit-per-user: ${AI_DAILY_LIMIT:100}

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
